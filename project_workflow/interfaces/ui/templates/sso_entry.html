<!doctype html><html lang="ru" data-theme="dark"{% if login_required %} data-platform-login-required{% endif %}>
<head><meta charset="utf-8"><title>Вход в платформу</title>
<script>{% include 'base/theme-preference.js' %};document.documentElement.dataset.theme=window.PdlcThemePreference.read('workflow-theme');</script>
<style>{% include 'base/base-ui.css' %}body{margin:0;background:var(--color-background,#111217);color:var(--color-text-primary,#f7f8f8);font:16px system-ui}main{max-width:640px;margin:10vh auto;padding:24px}</style></head>
<body><main><h1>Вход в платформу</h1><p{% if not login_required %} role="alert"{% endif %}>{{ message }}</p><a href="{{ login_url }}">Войти через SSO</a></main>
<script type="module">
{% include 'base/platform-bridge.js' %}
// An authentication result has no product route or application leave guards.
const client = connectPlatformProduct({serviceKey:'project-workflow',portalOrigin:{{ platform_origin|tojson }}});
if (client) {
  {% if login_required %}client.requireLogin('/');
  {% else %}client.readiness({ready:false,error:{{ message|tojson }}});{% endif %}
}
</script></body></html>
