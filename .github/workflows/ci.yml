name: CI

on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: project-workflow
    services:
      postgres:
        image: ${{ github.event_name == 'workflow_dispatch' && 'postgres:16-alpine' || '' }}
        env:
          POSTGRES_USER: project_workflow
          POSTGRES_PASSWORD: project_workflow
          POSTGRES_DB: project_workflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U project_workflow -d project_workflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PYTHONPATH: ${{ github.workspace }}/workflow-cli-base/base-modules/python/cli-core
    steps:
      - uses: actions/checkout@v4
        with:
          path: project-workflow
      - name: Read independent Base SDK contract revision
        id: base-sdk
        run: echo "sha=$(cat .base-revision)" >> "$GITHUB_OUTPUT"
      - name: Check out pinned Base SDK source
        uses: actions/checkout@v4
        with:
          repository: FerrPOINT/services-base
          path: services-base
          ref: ${{ steps.base-sdk.outputs.sha }}
          ssh-key: ${{ secrets.SERVICES_BASE_DEPLOY_KEY }}
          persist-credentials: false
      - name: Check out qualified shared CLI source independently of the SDK
        uses: actions/checkout@v4
        with:
          repository: FerrPOINT/services-base
          path: workflow-cli-base
          ref: 278be4a2eb0b3ce49dac2cd14ea7e2871f2ffe1d
          ssh-key: ${{ secrets.SERVICES_BASE_DEPLOY_KEY }}
          persist-credentials: false
      - name: Verify generated dependency-free namespace contract
        run: |
          python ../services-base/scripts/verify_base_revision.py --base ../services-base --revision .base-revision
          python ../services-base/scripts/export_python_namespace.py --out project_workflow/infrastructure/platform_namespace.py --check
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.10"
          enable-cache: true
      - name: Quick domain/SDK unit tests
        if: github.event_name != 'workflow_dispatch'
        run: uv run --isolated --with-requirements constraints.txt --all-extras python -B -m scripts.run_pytest -q tests/test_domain_entities.py tests/test_phase_graph.py tests/test_task_validator.py tests/test_schema.py --timeout=60
      - name: Unit and UI tests with the existing coverage floor
        if: github.event_name == 'workflow_dispatch'
        env:
          COVERAGE_CORE: sysmon
        run: uv run --isolated --with-requirements constraints.txt --all-extras python -B -m scripts.run_pytest -q --timeout=60 --cov=project_workflow --cov-report=term
      - name: Profession and platform navigation regression
        run: node scripts/test_profession_navigation.mjs
      - name: PostgreSQL integration tests
        if: github.event_name == 'workflow_dispatch'
        env:
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: project_workflow
          PGPASSWORD: project_workflow
          PGDATABASE: project_workflow
          WORKFLOW_APPLICATION_CLOCK_TEST_URL: postgresql+psycopg://project_workflow:project_workflow@127.0.0.1:5432/request_clock_fixture
        run: |
          psql --no-psqlrc -d "$PGDATABASE" -v ON_ERROR_STOP=1 -c 'CREATE DATABASE request_clock_fixture'
          uv run --isolated --with-requirements constraints.txt --all-extras python -B -m scripts.run_pytest -q -m integration --timeout=120
      - name: Lint
        run: uv run --isolated --with-requirements constraints.txt --all-extras ruff check .
      - name: Type check
        run: uv run --isolated --with-requirements constraints.txt --all-extras mypy project_workflow scripts
      - name: Documentation and README evidence gate
        if: github.event_name != 'workflow_dispatch'
        run: uv run --isolated --with-requirements constraints.txt --all-extras python -B -m scripts.run_pytest -q tests/test_docs_quality.py --timeout=60
      - name: Diff hygiene
        run: git diff --check
      - name: Preserve scoped pytest evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: workflow-pytest-evidence
          path: |
            project-workflow/.local/pytest-runs/*/result.json
            project-workflow/.local/pytest-runs/*/junit.xml
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
  compose-smoke:
    if: github.event_name == 'workflow_dispatch' && (github.actor != 'dependabot[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: project-workflow
    steps:
      - uses: actions/checkout@v4
        with:
          path: project-workflow
      - name: Compose config
        run: docker compose config -q
      - name: Build and start
        run: docker compose up --build -d --wait
      - name: Readiness
        run: curl --fail --retry 10 --retry-connrefused http://127.0.0.1:8812/health
      - name: Compose logs
        if: failure()
        run: docker compose logs --no-color
      - name: Compose cleanup
        if: always()
        run: docker compose down -v --remove-orphans
