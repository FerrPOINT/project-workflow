name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: project-workflow
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: project_workflow
          POSTGRES_PASSWORD: project_workflow
          POSTGRES_DB: project_workflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U project_workflow -d project_workflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: project_workflow
      PGPASSWORD: project_workflow
      PGDATABASE: project_workflow
    steps:
      - uses: actions/checkout@v4
        with:
          path: project-workflow
      - uses: actions/checkout@v4
        with:
          repository: FerrPOINT/services-base
          ref: main
          path: services-base
          ssh-key: ${{ secrets.SERVICES_BASE_DEPLOY_KEY }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.10"
          enable-cache: true
      - name: Unit and UI tests
        run: uv run --isolated --with-requirements constraints.txt --all-extras pytest -q --timeout=60
      - name: PostgreSQL integration tests
        run: uv run --isolated --with-requirements constraints.txt --all-extras pytest -q -m integration tests/test_postgres_integration.py --timeout=120
      - name: Lint
        run: uv run --isolated --with-requirements constraints.txt --all-extras ruff check .
      - name: Type check
        run: uv run --isolated --with-requirements constraints.txt --all-extras mypy project_workflow scripts
      - name: Documentation and README evidence gate
        run: uv run --isolated --with-requirements constraints.txt --all-extras pytest -q tests/test_docs_quality.py --timeout=60
      - name: Diff hygiene
        run: git diff --check
  compose-smoke:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: project-workflow
    steps:
      - uses: actions/checkout@v4
        with:
          path: project-workflow
      - uses: actions/checkout@v4
        with:
          repository: FerrPOINT/services-base
          ref: main
          path: services-base
          ssh-key: ${{ secrets.SERVICES_BASE_DEPLOY_KEY }}
          persist-credentials: false
      - name: Compose config
        run: docker compose config -q
      - name: Build and start
        run: docker compose up --build -d --wait
      - name: Readiness
        run: curl --fail --retry 10 --retry-connrefused http://127.0.0.1:8812/health
      - name: Compose logs
        if: failure()
        run: docker compose logs --no-color
      - name: Compose cleanup
        if: always()
        run: docker compose down -v --remove-orphans
